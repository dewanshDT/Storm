name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

# A newer push makes an in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Its own job, not a step in `server`: the relay is a standalone crate with
  # no workspace joining it to the server (R6), so it builds and caches on its
  # own. It had no CI at all until decision 68, so its only gate was a local
  # `make check`, and a green PR said nothing about it.
  relay:
    name: relay (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/relay
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/relay
            tools/relay-conformance
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Includes `tests/vectors.rs`, which reads `docs/srp-vectors.json`: the
      # relay's share of the check that three wire implementations agree.
      - run: cargo test
      # The black-box SRP v1 suite every relay must pass (decision 108a),
      # against the release build started with its fixture contract.
      - name: relay-conformance (fmt, clippy, unit)
        working-directory: tools/relay-conformance
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - run: make relay-conformance-local
        working-directory: .
      - name: relay logs on failure
        if: failure()
        working-directory: .
        run: cat .dev/conformance-relay.log .dev/conformance-relay-tofu.log || true

  # The Cloudflare relay (decision 108b): a second SRP v1 implementation, in
  # TypeScript, so its own job. The tests run inside workerd and read
  # docs/srp-vectors.json, the fourth implementation that file holds to.
  relay-cf:
    name: relay-cf (workers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/relay-cf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/relay-cf/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The 108a suite against the Worker under wrangler dev (decision 108c):
  # allowlist and TOFU, the 127.0.0.2 checks, no latency check.
  relay-conformance-cf:
    name: relay-conformance (workers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/relay-conformance
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/relay-cf/package-lock.json
      - run: make relay-conformance-cf
      - name: relay logs on failure
        if: failure()
        run: cat .dev/conformance-cf.log .dev/conformance-cf-tofu.log || true

  # The Runtime Host: its own crate and its own job, for the relay's reason —
  # it never depends on apps/server and no workspace joins them (decision 77).
  runtime:
    name: runtime (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/runtime
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The same Runtime Host on a real Mac (decision 83). The PTY and the
  # syscalls under it differ there (macOS's poll(2) does not support devices),
  # so the suite runs on macOS rather than only cross-compiling for it.
  runtime-macos:
    name: runtime (rust, macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/runtime
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The same Runtime Host on Windows (D16, decision 99): ConPTY, Job Objects,
  # the named pipe and DACLs exist only there, so the suite runs on Windows
  # rather than only cross-checking for it. `tests/windows.rs` is the carrier's
  # suite; the POSIX ones are compiled out.
  runtime-windows:
    name: runtime (rust, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/runtime
    steps:
      # The suites read files byte for byte; keep them as committed.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/runtime
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The server on a Mac (decision 84d): the same suite, on FSEvents instead of
  # inotify, plus the LaunchAgent code compiled for real.
  server-macos:
    name: server (rust, macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The server on Windows (decision 99): the same suite, on
  # ReadDirectoryChangesW and NTFS, plus the Scheduled Task code compiled for
  # real and its Windows-only tests (filename rules, `up`'s pure parts).
  server-windows:
    name: server (rust, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The interactive installer (decision 84): shellcheck, then the bats suite
  # (arguments, detection, plans, secrets on stdin only, the TUI on a pty).
  installer:
    name: installer (shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bats-core
        run: git clone --depth 1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
      - run: make installer-check
        env:
          SHELLCHECK: shellcheck
          BATS: ${{ runner.temp }}/bats/bin/bats

  # The same suite under macOS's own bash 3.2 and BSD tools.
  installer-macos:
    name: installer (shell, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: bats-core and shellcheck
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
          brew install shellcheck
      - name: make installer-check (bash 3.2)
        run: |
          /bin/bash --version | head -1
          PATH="/bin:$PATH" make installer-check
        env:
          SHELLCHECK: shellcheck
          BATS: ${{ runner.temp }}/bats/bin/bats
  client:
    name: client (flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test test_live
      - run: flutter analyze
      - run: flutter test

  integration:
    name: integration (client against a real server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
        working-directory: apps/client
      # `make test-live` starts the server, runs both integration suites and
      # tears the server down, so CI does not need to know that dance.
      - run: make test-live
      - name: server log on failure
        if: failure()
        run: cat .dev/live-server.log || true

  browser:
    name: browser (web sign-in in Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets
      # The runner image ships Firefox; the test drives it over WebDriver
      # BiDi against a real server on a non-loopback (insecure) origin, the
      # way a LAN Storm is reached (decision 90).
      - run: firefox --version
      - run: flutter pub get
        working-directory: apps/client
      - run: make test-browser

  www:
    name: www (astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/www
    steps:
      # Tags, because check-claims.sh compares the site's release tag against
      # the newest one. A shallow checkout has none and the check goes quiet.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/www/package-lock.json
      - run: npm ci
      - run: npm run build
      # A green build says the site compiles, not that it is true.
      - run: ./scripts/check-claims.sh
      # The Homebrew formula (the repo is the tap) names the same release as
      # the site, or every Mac installs the previous one (decision 83).
      - run: ../../tools/formula-check.sh
