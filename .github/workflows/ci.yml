name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

# A newer push makes an in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a pull request each job runs only when something it reads changed;
  # pushes to main and tags run everything. `all` covers what every job reads.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ github.event_name != 'pull_request' || steps.f.outputs.all == 'true' }}
      server: ${{ steps.f.outputs.server }}
      relay: ${{ steps.f.outputs.relay }}
      relay_cf: ${{ steps.f.outputs.relay_cf }}
      feedback: ${{ steps.f.outputs.feedback }}
      feedback_cf: ${{ steps.f.outputs.feedback_cf }}
      runtime: ${{ steps.f.outputs.runtime }}
      diag: ${{ steps.f.outputs.diag }}
      installer: ${{ steps.f.outputs.installer }}
      client: ${{ steps.f.outputs.client }}
      widgetbook: ${{ steps.f.outputs.widgetbook }}
      live: ${{ steps.f.outputs.live }}
      www: ${{ steps.f.outputs.www }}
      release_channel: ${{ steps.f.outputs.release_channel }}
      apt_repo: ${{ steps.f.outputs.apt_repo }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: f
        with:
          filters: |
            all:
              - .github/**
              - Makefile
            vectors: &vectors
              - docs/*.json
              - tools/srp-vectors/**
              - tools/runtime-vectors/**
            # Decision 162c: a leaf crate both apps/server and apps/runtime
            # depend on by path, so a change to it must run both their jobs
            # too, not only its own.
            diag_crate: &diag_crate
              - crates/storm-diag/**
            server:
              - *vectors
              - *diag_crate
              - apps/server/**
              - tools/www-facts/**
              - kit/**
              - deploy/**
            relay:
              - *vectors
              - apps/relay/**
              - tools/relay-conformance/**
              - deploy/storm-relay*
              - deploy/journald*
            relay_cf:
              - *vectors
              - apps/relay-cf/**
              - tools/relay-conformance/**
            feedback:
              - deploy/feedback/**
              - docs/srp-vectors.json
            feedback_cf:
              - apps/feedback-cf/**
            runtime:
              - *vectors
              - *diag_crate
              - apps/runtime/**
              - tools/www-facts/**
              - deploy/storm-runtime.service
              - deploy/storm-runtime-user.service
              - deploy/storm-runtime-isolation.*
              - deploy/runtime.toml.example
            diag:
              - *diag_crate
            installer:
              - deploy/install.sh
              - deploy/storm-backup.sh
              - deploy/runtime-tarball.sh
              - tools/installer-tests/**
            # Decision 163c: the channel a tag publishes to, decided once by
            # ancestry and read by release.yml's publish job.
            release_channel:
              - tools/release-channel.sh
              - tools/release-channel-test.sh
              - .github/workflows/release.yml
            # Decision 163e: the cumulative two-suite apt repo.
            apt_repo:
              - deploy/apt-repo-build.sh
              - deploy/apt-repo-bootstrap.sh
              - tools/apt-repo-build-test.sh
              - .github/workflows/apt-repo.yml
            client:
              - *vectors
              - apps/client/**
            # Decision 164: the catalogue imports the client's lib/ui by path.
            widgetbook:
              - apps/client/**
              - apps/widgetbook/**
            # make test-live and test-browser build the server, relay and
            # runtime and run the server's e2e suites against them.
            live:
              - *vectors
              - *diag_crate
              - apps/client/**
              - apps/server/**
              - apps/relay/**
              - apps/runtime/**
              - tools/relay-conformance/**
              - kit/**
            # check-claims reads more than the site: the MCP tool list is
            # checked against mcp.rs, and the account phrasings against the
            # root README, so a change to either must run it. docs/site/ is
            # the docs' content and is built by this job.
            www:
              - apps/www/**
              - apps/server/src/mcp.rs
              - README.md
              - docs/site/**
              - tools/www-facts/**
              - Formula/**
              - deploy/storm.env.example
              - deploy/install.sh
              - apps/server/src/mcp.rs
  server:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.server == 'true'
    name: server (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The docs' CLI reference is this binary's --help, kept in
      # apps/www/src/data/facts.json; a changed flag fails here until it is
      # regenerated (`make www-facts`).
      - run: cargo build
      - run: python3 ../../tools/www-facts/generate.py --check --server target/debug/storm-server

  # Its own job, not a step in `server`: the relay is a standalone crate with
  # no workspace joining it to the server (R6), so it builds and caches on its
  # own. It had no CI at all until decision 68, so its only gate was a local
  # `make check`, and a green PR said nothing about it.
  relay:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.relay == 'true'
    name: relay (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/relay
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/relay
            tools/relay-conformance
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Includes `tests/vectors.rs`, which reads `docs/srp-vectors.json`: the
      # relay's share of the check that three wire implementations agree.
      - run: cargo test
      # The black-box SRP v1 suite every relay must pass (decision 108a),
      # against the release build started with its fixture contract.
      - name: relay-conformance (fmt, clippy, unit)
        working-directory: tools/relay-conformance
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - run: make relay-conformance-local
        working-directory: .
      - name: relay logs on failure
        if: failure()
        working-directory: .
        run: cat .dev/conformance-relay.log .dev/conformance-relay-tofu.log || true

  # The Cloudflare relay (decision 108b): a second SRP v1 implementation, in
  # TypeScript, so its own job. The tests run inside workerd and read
  # docs/srp-vectors.json, the fourth implementation that file holds to.
  relay-cf:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.relay_cf == 'true'
    name: relay-cf (workers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/relay-cf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/relay-cf/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Three runs: the suite proves deadlines in milliseconds, and a test that
      # races one fails here, in review, rather than in a release's check.
      - run: for i in 1 2 3; do npm test || exit 1; done

  # The 108a suite against the Worker under wrangler dev (decision 108c):
  # allowlist and TOFU, the 127.0.0.2 checks, no latency check.
  relay-conformance-cf:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.relay_cf == 'true'
    name: relay-conformance (workers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/relay-conformance
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/relay-cf/package-lock.json
      - run: make relay-conformance-cf
      - name: relay logs on failure
        if: failure()
        run: cat .dev/conformance-cf.log .dev/conformance-cf-tofu.log || true

  # deploy/feedback/feedback-sync.py (decision 162-6): a standalone script,
  # not part of the product, so its own lightweight job rather than a step
  # in `server` — stdlib-only Python, nothing to build or cache.
  feedback-sync:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.feedback == 'true'
    name: feedback-sync (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-feedback-sync

  # Decision 162c: a leaf crate both apps/server and apps/runtime depend on
  # by path. Its own job for the relay's reason — it is not in either's
  # workspace (there is none), so its own tests only run here.
  diag:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.diag == 'true'
    name: diag (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/storm-diag
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/storm-diag
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The feedback intake Worker (decision 162d): its own TypeScript app on
  # Workers + R2 + a Durable Object, so relay-cf's job for the same reason —
  # its tests run inside workerd.
  feedback-cf:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.feedback_cf == 'true'
    name: feedback-cf (workers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/feedback-cf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/feedback-cf/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The Runtime Host: its own crate and its own job, for the relay's reason —
  # it never depends on apps/server and no workspace joins them (decision 77).
  runtime:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.runtime == 'true'
    name: runtime (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/runtime
            apps/runtime/isolation
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build
      - run: python3 ../../tools/www-facts/generate.py --check --runtime target/debug/storm-runtime
      # Per-session isolation's root helper (decision 136): its own crate,
      # Linux only, and its units checked by systemd itself.
      - name: isolation helper
        working-directory: apps/runtime/isolation
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: isolation units (systemd-analyze)
        working-directory: .
        run: make verify-isolation-units

  # The same Runtime Host on a real Mac (decision 83). The PTY and the
  # syscalls under it differ there (macOS's poll(2) does not support devices),
  # so the suite runs on macOS rather than only cross-compiling for it.
  runtime-macos:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.runtime == 'true'
    name: runtime (rust, macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/runtime
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The same Runtime Host on Windows (D16, decision 99): ConPTY, Job Objects,
  # the named pipe and DACLs exist only there, so the suite runs on Windows
  # rather than only cross-checking for it. `tests/windows.rs` is the carrier's
  # suite; the POSIX ones are compiled out.
  runtime-windows:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.runtime == 'true'
    name: runtime (rust, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/runtime
    steps:
      # The suites read files byte for byte; keep them as committed.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/runtime
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The server on a Mac (decision 84d): the same suite, on FSEvents instead of
  # inotify, plus the LaunchAgent code compiled for real.
  server-macos:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.server == 'true'
    name: server (rust, macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The server on Windows (decision 99): the same suite, on
  # ReadDirectoryChangesW and NTFS, plus the Scheduled Task code compiled for
  # real and its Windows-only tests (filename rules, `up`'s pure parts).
  server-windows:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.server == 'true'
    name: server (rust, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The interactive installer (decision 84): shellcheck, then the bats suite
  # (arguments, detection, plans, secrets on stdin only, the TUI on a pty).
  installer:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.installer == 'true'
    name: installer (shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bats-core
        run: git clone --depth 1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
      - run: make installer-check
        env:
          SHELLCHECK: shellcheck
          BATS: ${{ runner.temp }}/bats/bin/bats

  # The same suite under macOS's own bash 3.2 and BSD tools.
  installer-macos:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.installer == 'true'
    name: installer (shell, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: bats-core and shellcheck
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
          brew install shellcheck
      - name: make installer-check (bash 3.2)
        run: |
          /bin/bash --version | head -1
          PATH="/bin:$PATH" make installer-check
        env:
          SHELLCHECK: shellcheck
          BATS: ${{ runner.temp }}/bats/bin/bats
  # Decision 163c: the ancestry check release.yml's publish job reads, proven
  # against a disposable git repo it builds itself — no checkout content
  # needed beyond the script.
  release-channel:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.release_channel == 'true'
    name: release channel (shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-release-channel

  # Decision 163e's dry-run proof (163-7): the cumulative repo script against
  # tiny dummy .debs, for a stable release, a latest release, then a stable
  # fix — never the real workflow, never a real GitHub Pages deploy.
  apt-repo-build:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.apt_repo == 'true'
    name: apt repo build (shell, fixture debs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y reprepro gnupg
      - run: make test-apt-repo-build

  client:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.client == 'true'
    name: client (flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      # package:sqlite3's build hook downloads its prebuilt library from GitHub
      # releases on every cold build; a failed download there reads as a hash
      # mismatch. The hook re-checks the hash of a cached copy before using it.
      - uses: actions/cache@v4
        with:
          path: apps/client/.dart_tool/hooks_runner/shared/sqlite3
          key: client-sqlite3-${{ runner.os }}-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: client-sqlite3-${{ runner.os }}-
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test test_live
      - run: flutter analyze
      - run: flutter test

  # Decision 164: the component catalogue. Its `directories` file is committed;
  # regenerating it and diffing is what catches a use case added without it.
  widgetbook:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.widgetbook == 'true'
    name: widgetbook (flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/widgetbook
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - uses: actions/cache@v4
        with:
          path: apps/widgetbook/.dart_tool/hooks_runner/shared/sqlite3
          key: widgetbook-sqlite3-${{ runner.os }}-${{ hashFiles('apps/widgetbook/pubspec.lock') }}
          restore-keys: widgetbook-sqlite3-${{ runner.os }}-
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: dart run build_runner build
      - run: dart tool/ui_usage.dart && dart format lib/usage.g.dart
      - run: git diff --exit-code -- lib/main.directories.g.dart lib/usage.g.dart
      - run: flutter test

  # The desktop runners are native code the Dart suite never compiles
  # (decision 125): a template edit or a plugin that lacks Windows support
  # surfaces only here.
  client-windows:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.client == 'true'
    name: client (windows build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - uses: actions/cache@v4
        with:
          path: apps/client/.dart_tool/hooks_runner/shared/sqlite3
          key: client-sqlite3-${{ runner.os }}-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: client-sqlite3-${{ runner.os }}-
      - run: flutter pub get
      - run: flutter build windows --release

  # The Linux runner, likewise: a template edit or a plugin that lacks Linux
  # support surfaces only here. 22.04 and the glibc ceiling are the release's: a
  # bundle built against a newer glibc refuses to start on Debian 12.
  client-linux:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.client == 'true'
    name: client (linux build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - uses: actions/cache@v4
        with:
          path: apps/client/.dart_tool/hooks_runner/shared/sqlite3
          key: client-sqlite3-${{ runner.os }}-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: client-sqlite3-${{ runner.os }}-
      - run: flutter pub get
      - run: flutter build linux --release
      - run: STORM_MAX_GLIBC=2.35 tool/package_linux.sh 0.0.0 dist

  integration:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.live == 'true'
    name: integration (client against a real server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - uses: actions/cache@v4
        with:
          path: apps/client/.dart_tool/hooks_runner/shared/sqlite3
          key: client-sqlite3-${{ runner.os }}-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: client-sqlite3-${{ runner.os }}-
      - run: flutter pub get
        working-directory: apps/client
      # `make test-live` starts the server, runs both integration suites and
      # tears the server down, so CI does not need to know that dance.
      - run: make test-live
      - name: server log on failure
        if: failure()
        run: cat .dev/live-server.log || true

  browser:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.live == 'true'
    name: browser (web sign-in in Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets
      # The runner image ships Firefox; the test drives it over WebDriver
      # BiDi against a real server on a non-loopback (insecure) origin, the
      # way a LAN Storm is reached (decision 90).
      - run: firefox --version
      - run: flutter pub get
        working-directory: apps/client
      - run: make test-browser

  www:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.www == 'true'
    name: www (astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/www
    steps:
      # Tags, because check-claims.sh compares the site's release tag against
      # the newest one. A shallow checkout has none and the check goes quiet.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/www/package-lock.json
      - run: npm ci
      - run: npm run build
      # A green build says the site compiles, not that it is true.
      - run: ./scripts/check-claims.sh
      # The Homebrew formula (the repo is the tap) names the same release as
