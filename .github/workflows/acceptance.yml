name: Acceptance builds

# The native apps of a branch, for on-device acceptance, **without a
# release**: push the commit to `acceptance/<anything>` and download the
# artifacts. Nothing here creates a GitHub Release, touches the apt repo or
# moves `main` (decision 45: only a tag makes a release).
#
# This is also the only place the app's own Kotlin and Swift get compiled
# before a release: PR CI runs `flutter analyze` and the Dart tests, which
# never build the native projects (decision 81l).
#
# The APK is signed exactly as a release's would be: with the upload
# keystore when its secrets (STORM_UPLOAD_*) exist, debug-signed otherwise
# (decision 81m: as of 2026-10-08 they do not). Its build number is the
# latest release's, so with the same key it installs as an update over that
# release, and the next release still updates over it.
#
# Both apps also carry the latest release's version name (B-3 of the macOS
# manual round): pubspec says 0.1.0, which a release overrides from its tag,
# and an acceptance build that kept it showed "may not be compatible" against
# a 0.4 server.

on:
  push:
    branches: ["acceptance/**"]

permissions:
  contents: read
  actions: read   # the latest release's run number

jobs:
  android:
    name: android (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The release workflow's step, unchanged: the values go to the build's
      # environment, which Actions masks; nothing here prints them.
      - name: Decode keystore
        env:
          STORE_B64: ${{ secrets.STORM_UPLOAD_STORE_BASE64 }}
        run: |
          if [ -z "$STORE_B64" ]; then
            echo "::warning::STORM_UPLOAD_STORE_BASE64 is not set: this APK is debug-signed and will not install over a release"
            exit 0
          fi
          echo "$STORE_B64" | base64 -d > "$RUNNER_TEMP/storm-upload.jks"
          echo "STORM_UPLOAD_STORE_FILE=$RUNNER_TEMP/storm-upload.jks" >> "$GITHUB_ENV"
          echo "STORM_UPLOAD_STORE_PASSWORD=${{ secrets.STORM_UPLOAD_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "STORM_UPLOAD_KEY_ALIAS=${{ secrets.STORM_UPLOAD_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "STORM_UPLOAD_KEY_PASSWORD=${{ secrets.STORM_UPLOAD_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: The latest release's build number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?status=success&per_page=1" \
                --jq '.workflow_runs[0].run_number')
          echo "RELEASE_BUILD_NUMBER=${n:-1}" >> "$GITHUB_ENV"
      - name: The latest release's version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          echo "RELEASE_VERSION=${v#v}" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: apps/client
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name="${RELEASE_VERSION}" \
            --build-number="${RELEASE_BUILD_NUMBER}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/storm-acceptance-${GITHUB_SHA::7}.apk"
      - name: Forget the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/storm-upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-acceptance
          path: apps/client/dist/*
          retention-days: 14

  macos:
    name: macos (app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: The latest release's version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          echo "RELEASE_VERSION=${v#v}" >> "$GITHUB_ENV"
      - name: Build macOS app
        working-directory: apps/client
        run: |
          flutter pub get
          flutter build macos --release \
            --build-name="${RELEASE_VERSION}" \
            --build-number="${GITHUB_RUN_NUMBER}"
          # The version the app will report (B-3).
          shown=$(plutil -extract CFBundleShortVersionString raw \
            build/macos/Build/Products/Release/Storm.app/Contents/Info.plist)
          echo "CFBundleShortVersionString: $shown"
          test "$shown" = "${RELEASE_VERSION}"
          mkdir -p dist
          APP="build/macos/Build/Products/Release/Storm.app"
          test -d "$APP"
          # Ad-hoc signed and unnotarized, like a release's.
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "dist/Storm-acceptance-${GITHUB_SHA::7}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-acceptance
          path: apps/client/dist/*
          retention-days: 14
      - name: Screenshot the window chrome (temporary, r2-chrome)
        if: always()
        working-directory: apps/client
        run: |
          mkdir -p shots
          open build/macos/Build/Products/Release/Storm.app
          sleep 25
          screencapture -x shots/macos-window.png
          osascript -e 'tell application "System Events" to get {position, size} of window 1 of process "Storm"' || true
          osascript -e 'tell application "System Events" to keystroke "f" using {command down, control down}' || true
          sleep 6
          screencapture -x shots/macos-fullscreen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-chrome-shots
          path: apps/client/shots/*

  # The Windows app (decision 125d), packaged by the release's own script, so
  # a tester gets the zip a release would ship.
  windows:
    name: windows (app)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: The latest release's version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          echo "RELEASE_VERSION=${v#v}" >> "$GITHUB_ENV"
      - name: Build Windows app
        working-directory: apps/client
        run: |
          flutter pub get
          flutter build windows --release \
            --build-name="${RELEASE_VERSION}" \
            --build-number="${GITHUB_RUN_NUMBER}"
          tool/package_windows.sh "dist/storm-app-acceptance-${GITHUB_SHA::7}-windows-x86_64.zip" \
            "acceptance ${GITHUB_SHA::7}"
      # AC-D1–D3 as far as a runner can: the zip alone starts a window titled
      # Storm (a missing DLL would leave a dialog with another title), and a
      # second launch leaves one process.
      - name: The zip starts, once
        shell: pwsh
        working-directory: apps/client
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'storm-smoke'
          Expand-Archive (Get-Item dist/*.zip).FullName -DestinationPath $dir
          $first = Start-Process (Join-Path $dir 'storm.exe') -PassThru
          $title = ''
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            $first.Refresh()
            if ($first.HasExited) { throw "storm.exe exited with $($first.ExitCode)" }
            $title = $first.MainWindowTitle
            if ($title) { break }
          }
          "window title: '$title'"
          if ($title -ne 'Storm') { throw "expected a window titled Storm, got '$title'" }
          $second = Start-Process (Join-Path $dir 'storm.exe') -PassThru -Wait
          "second launch exited with $($second.ExitCode)"
          $count = @(Get-Process -Name storm -ErrorAction SilentlyContinue).Count
          Stop-Process -Id $first.Id
          if ($second.ExitCode -ne 0) { throw 'the second launch failed' }
          if ($count -ne 1) { throw "$count storm processes after a second launch" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance
          path: apps/client/dist/*
          retention-days: 14
      - name: Screenshot the window chrome (temporary, r2-chrome)
        if: always()
        shell: pwsh
        working-directory: apps/client
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'storm-shot'
          Expand-Archive (Get-Item dist/*.zip).FullName -DestinationPath $dir -Force
          $p = Start-Process (Join-Path $dir 'storm.exe') -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save((Join-Path (Get-Location) 'shots/windows.png'))
          "title: '$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-chrome-shots
          path: apps/client/shots/*

  # The Linux app (decision 125f), packaged by the release's own script, on
  # the release's runner and with its glibc ceiling.
  linux:
    name: linux (app)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: The latest release's version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          echo "RELEASE_VERSION=${v#v}" >> "$GITHUB_ENV"
      - name: Build Linux app
        working-directory: apps/client
        run: |
          flutter pub get
          flutter build linux --release \
            --build-name="${RELEASE_VERSION}" \
            --build-number="${GITHUB_RUN_NUMBER}"
          STORM_MAX_GLIBC=2.35 tool/package_linux.sh "${RELEASE_VERSION}+acceptance.${GITHUB_SHA::7}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-acceptance
          path: apps/client/dist/*
          retention-days: 14
      - name: Screenshot the window chrome (temporary, r2-chrome)
        if: always()
        working-directory: apps/client
        run: |
          sudo apt-get install -y xvfb openbox imagemagick dbus-x11
          mkdir -p shots
          Xvfb :99 -screen 0 1440x900x24 & sleep 2
          export DISPLAY=:99
          openbox & sleep 2
          (build/linux/x64/release/bundle/storm > shots/linux.log 2>&1 &) ; sleep 25
          import -window root shots/linux-openbox.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-chrome-shots
          path: apps/client/shots/*
