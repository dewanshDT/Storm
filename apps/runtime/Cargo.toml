[package]
name = "storm-runtime"
version = "0.1.0"
edition = "2024"
description = "Storm Runtime Host — the execution plane that runs agent sessions"
license = "MIT"
repository = "https://github.com/dewanshDT/Storm"

# Deliberately standalone, like apps/relay: there is no root Cargo workspace,
# and this crate never depends on apps/server (freeze §5.8, the R6 reasoning).
# The host and the server share a wire format, not code; when the two need to
# agree on bytes, docs/runtime-vectors.json is what makes them agree.

# The provider contract has no dependencies at all (decision 77): PTY I/O is
# blocking threads anyway, and an async runtime in the contract would leak into
# every provider. The host link brings tokio in slice 4, at its own edge.
[dependencies]
