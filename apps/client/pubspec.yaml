name: storm
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Clean URLs for the web client's deep links.
  flutter_web_plugins:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  web_socket_channel: ^3.0.3
  file_selector: ^1.1.0
  go_router: ^17.4.0
  flutter_lucide: ^1.11.0
dev_dependencies:
  # Used by test/cache_migration_test.dart to build a pre-migration schema
  # by hand — the only way to exercise the upgrade path for real.
  sqlite3: ^3.5.1
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  icons_launcher: ^3.1.0

# App icons, generated from `assets/logo.svg`:
#
#   python3 tool/make_icons.py     # SVG -> the three PNGs below
#   dart run icons_launcher:create # PNGs -> every platform's icon files
#
# Three source images rather than one, because the platforms genuinely differ:
# macOS wants the margin Apple reserves around an icon, Android's launcher
# supplies its own mask and needs full bleed, and an adaptive icon needs its
# foreground on a transparent background so the system can move it. See
# `tool/make_icons.py` for how each is produced.
icons_launcher:
  image_path: "assets/icon/storm_icon.png"
  platforms:
    android:
      enable: true
      image_path: "assets/icon/storm_icon_full.png"
      # The card's mint, as a colour rather than an image — the background of
      # an adaptive icon is parallaxed and cropped, and a flat colour is the
      # one thing that survives that intact.
      adaptive_background_color: "#96f2d7"
      adaptive_foreground_image: "assets/icon/storm_mark.png"
      adaptive_round_image: "assets/icon/storm_icon_full.png"
      # Android 13 themed icons: the system tints by alpha, so the mark alone
      # is exactly the right layer.
      adaptive_monochrome_image: "assets/icon/storm_mark.png"
    macos:
      enable: true
      image_path: "assets/icon/storm_icon.png"
    # Off deliberately. The Linux handler's only output is snap packaging —
    # a snapcraft.yaml with a placeholder dbus name and `Categories=Entertainment`
    # — and Storm is not shipped as a snap. Checking that in would describe a
    # packaging story that does not exist. Flutter's Linux runner has no other
    # icon slot; there is nowhere for one to go until there is a package.
    linux:
      enable: false
    web:
      enable: true
      image_path: "assets/icon/storm_icon.png"
      maskable_image_path: "assets/icon/storm_icon_full.png"
      favicon_path: "assets/icon/storm_icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Serif for note bodies only; chrome stays sans. Bundled rather than fetched
  # at runtime — the whole point of this app is that it works offline.
  # Newsreader (OFL), variable weight, so two files cover every weight.
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic

    # Chrome and display. Bundled rather than relying on the platform face, so
    # the design is identical on macOS, Android, Linux and the web — and so it
    # works with no network, the same rule that keeps Newsreader bundled.
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600

    # Labels, metadata, key chips and code.
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

  # The brand mark, shown in the app rather than only on the launcher icon.
  # It was referenced by the icons_launcher config below long before it was
  # declared here, which is enough to generate the launcher icons and *not*
  # enough for Image.asset to find it at runtime.
  assets:
    - assets/icon/storm_icon_full.png

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
