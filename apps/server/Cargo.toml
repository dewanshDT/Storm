[package]
name = "storm-server"
version = "0.1.0"
edition = "2024"
description = "Self-hosted markdown notes sync server"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dewanshDT/Storm"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["ws"] }
blake3 = "1.8.5"
clap = { version = "4.6.5", features = ["derive", "env"] }
data-encoding = "2.11.1"
# Renders the pairing URI as a scannable block for `storm-server pair --qr`.
# Default features off: the image/svg renderers pull a decoder stack we never
# use, and the terminal is the only surface this has.
qrcode = { version = "0.14", default-features = false }
diffy = "0.5.1"
ed25519-dalek = "3.0.0"
notify = "8.2.0"
rand = "0.10.2"
rmcp = { version = "=3.1.2", features = ["server", "transport-streamable-http-server", "macros"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "cors", "trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
walkdir = "2.5.0"

[dev-dependencies]
tempdir = "0.3.7"
tower = { version = "0.5.3", features = ["util"] }

# Packaged with `cargo deb`. The release job copies the Flutter web build into
# packaging/web/ before invoking cargo-deb so the .deb ships a real client.
[package.metadata.deb]
name = "storm-server"
maintainer = "Dewansh Singh Thakur <dewansh.dt@gmail.com>"
copyright = "2026 Dewansh Singh Thakur"
extended-description = """\
Storm sync server: owns canonical markdown vaults, merges concurrent edits, \
and serves the Flutter web client. Install the package, then run \
`sudo storm-server up` to enable the systemd unit."""
section = "utils"
priority = "optional"
depends = "$auto"
maintainer-scripts = "debian/"
conf-files = ["/etc/storm/storm.env"]
assets = [
    ["target/release/storm-server", "usr/bin/", "755"],
    # Recursive files only. `packaging/web/` and `packaging/web/**` match
    # directories; cargo-deb then drops dirs from the glob result and fails with
    # "Can't resolve asset" (v0.2.0 / v0.2.1). `**/*` is the pattern that works.
    ["packaging/web/**/*", "usr/share/storm/web/", "644"],
    ["../../deploy/storm-server.service", "lib/systemd/system/", "644"],
    ["../../deploy/storm-backup.service", "lib/systemd/system/", "644"],
    ["../../deploy/storm-backup.timer", "lib/systemd/system/", "644"],
    ["../../deploy/storm-backup.sh", "usr/bin/", "755"],
    ["../../deploy/storm.env.example", "etc/storm/storm.env", "600"],
    ["../../LICENSE", "usr/share/doc/storm-server/", "644"],
]
