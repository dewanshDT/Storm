[package]
name = "relay-conformance"
version = "0.1.0"
edition = "2024"
description = "Black-box SRP v1 conformance suite for any relay, driven over its public URL"
license = "MIT"
publish = false

# Standalone, like every crate here: no workspace, and no dependency on
# apps/relay. The suite may only know a relay through its URL, so linking the
# implementation it judges would let the two quietly agree.

[dependencies]
anyhow = "1.0.104"
data-encoding = "2.11.1"
ed25519-dalek = "3.0.0"
futures-util = "0.3"
rand = "0.10.2"
# `ring`, never the default provider: the same choice as apps/server, which
# installs it at the top of main for tungstenite's wss:// client.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
